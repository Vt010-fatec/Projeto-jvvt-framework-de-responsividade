<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Galeria de Viagens</title>

    <!-- Framework Bulma -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <section class="hero is-info">
        <div class="hero-body has-text-centered">

            <h1 class="title">
                📸 Galeria de Viagens
            </h1>

            <p class="subtitle">
                Alguns lugares incríveis para conhecer
            </p>

        </div>
    </section>

    <section class="section">

        <div class="container">

            <div class="columns is-multiline">

                <div class="column is-one-third">
                    <div class="card">

                        <div class="card-image">
                            <figure class="image">
                                <img
                                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                                    alt="Praia">
                            </figure>
                        </div>

                        <div class="card-content">
                            <p class="title is-5">Praias</p>
                            <p>
                                Lugares para relaxar e aproveitar
                                a natureza.
                            </p>
                        </div>

                    </div>
                </div>


                <div class="column is-one-third">
                    <div class="card">

                        <div class="card-image">
                            <figure class="image">
                                <img
                                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                                    alt="Montanhas">
                            </figure>
                        </div>

                        <div class="card-content">
                            <p class="title is-5">Montanhas</p>
                            <p>
                                Paisagens naturais para quem gosta
                                de aventura.
                            </p>
                        </div>

                    </div>
                </div>


                <div class="column is-one-third">
                    <div class="card">

                        <div class="card-image">
                            <figure class="image">
                                <img
                                    src="https://images.unsplash.com/photo-1518391846015-55a9cc003b25?auto=format&fit=crop&w=800&q=80"
                                    alt="Cidade">
                            </figure>
                        </div>

                        <div class="card-content">
                            <p class="title is-5">Cidades</p>
                            <p>
                                Conheça novas culturas e lugares
                                históricos.
                            </p>
                        </div>

                    </div>
                </div>

            </div>

            <div class="has-text-centered mt-5">

                <a <a href="./index.html" class="button is-info">
    ← Voltar para o início
</a>

                </a>

            </div>

        </div>

    </section>

</body>
</html>
